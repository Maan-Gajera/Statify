<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statify - Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-cyan: #00f2ff;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    body {
      background: radial-gradient(circle at top right, #1a1c2e, #05070a);
      color: white;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
    }

    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
    }

    .nav-blur {
      background: rgba(5, 7, 10, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
    }

    .auth-input {
      background: rgba(15, 23, 42, 0.8) !important;
      border: 1px solid var(--glass-border) !important;
      color: white !important;
      outline: none !important;
      transition: border-color 0.3s ease;
      width: 100%;
      padding: 14px 16px 14px 44px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .auth-input:focus {
      border-color: var(--neon-cyan) !important;
      box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.08);
    }
    .auth-input::placeholder { color: #4b5563; }

    .btn-neon {
      background: linear-gradient(90deg, #00f2ff, #0072ff);
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
      border: none;
      transition: all 0.3s ease;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .btn-neon:hover {
      box-shadow: 0 0 25px rgba(0, 242, 255, 0.6);
      transform: scale(1.02);
    }

    .glow-blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(0, 242, 255, 0.06);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
    .alert.error   { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; }

    .strength-bar {
      height: 3px;
      border-radius: 2px;
      transition: all 0.3s ease;
      background: #1e293b;
    }
    .strength-bar.weak   { background: #ef4444; width: 33%; }
    .strength-bar.medium { background: #f59e0b; width: 66%; }
    .strength-bar.strong { background: #22c55e; width: 100%; }

    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 0;
    }
    .eye-btn:hover { color: var(--neon-cyan); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease; }
  </style>
</head>
<body class="overflow-x-hidden">

  <nav class="nav-blur sticky top-0 z-50 py-4 px-8">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a class="flex items-center gap-3" href="#">
        <div class="w-10 h-10 border-2 border-[#00eaff] rounded-xl flex items-center justify-center font-bold text-[#00eaff] shadow-[0_0_10px_rgba(0,234,255,0.3)]">
          S
        </div>
        <span class="text-2xl font-bold tracking-tight text-white">Statify</span>
      </a>
    </div>
  </nav>

  <div class="glow-blob" style="top: -100px; right: -100px;"></div>
  <div class="glow-blob" style="bottom: -100px; left: -100px; background: rgba(0,114,255,0.05);"></div>

  <div class="min-h-[calc(100vh-72px)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md fade-in">

      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-cyan-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-cyan-500/20">
          <i class="fas fa-shield-halved text-cyan-400 text-2xl"></i>
        </div>
        <h1 class="text-4xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-white via-cyan-200 to-blue-400">
          New Password
        </h1>
        <p class="text-gray-500 text-sm">Choose a strong password for your Statify account.</p>
      </div>

      <div class="glass-card p-8">

        {% if error %}
        <div class="alert error flex items-center gap-2">
          <i class="fas fa-circle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <div id="js-alert" class="alert error" style="display:none;"></div>

        <form id="reset-form" method="POST" action="/reset-password/{{ token }}" class="space-y-5">

          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="password" name="password" id="new-password"
                   class="auth-input" placeholder="New password"
                   oninput="checkStrength(this.value)" required>
            <button type="button" class="eye-btn" onclick="togglePassword('new-password', this)">
              <i class="fas fa-eye text-sm"></i>
            </button>
          </div>

          <div>
            <div class="strength-bar" id="strength-bar"></div>
            <p id="strength-label" class="text-xs text-gray-600 mt-1"></p>
          </div>

          <div class="relative">
            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="password" name="confirm_password" id="confirm-password"
                   class="auth-input" placeholder="Confirm new password" required>
            <button type="button" class="eye-btn" onclick="togglePassword('confirm-password', this)">
              <i class="fas fa-eye text-sm"></i>
            </button>
          </div>

          <!-- Password requirements hint -->
          <ul class="text-xs text-gray-600 space-y-1 pl-1">
            <li id="req-len"    class="flex items-center gap-2"><i class="fas fa-circle text-[6px]"></i> At least 6 characters</li>
            <li id="req-upper"  class="flex items-center gap-2"><i class="fas fa-circle text-[6px]"></i> One uppercase letter</li>
            <li id="req-number" class="flex items-center gap-2"><i class="fas fa-circle text-[6px]"></i> One number</li>
          </ul>

          <button type="button" onclick="handleReset()"
                  class="btn-neon w-full py-4 rounded-xl font-bold text-white uppercase tracking-widest text-sm">
            Update Password
          </button>
        </form>

        <p class="text-center text-xs text-gray-500 mt-6">
          <a href="/login" class="text-cyan-400 hover:text-white transition">← Back to login</a>
        </p>
      </div>

    </div>
  </div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon  = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function checkStrength(val) {
      const bar   = document.getElementById('strength-bar');
      const label = document.getElementById('strength-label');
      bar.className = 'strength-bar';

      // Update requirement hints
      document.getElementById('req-len').style.color    = val.length >= 6 ? '#22c55e' : '#4b5563';
      document.getElementById('req-upper').style.color  = /[A-Z]/.test(val) ? '#22c55e' : '#4b5563';
      document.getElementById('req-number').style.color = /[0-9]/.test(val) ? '#22c55e' : '#4b5563';

      if (!val) { label.textContent = ''; return; }

      let score = 0;
      if (val.length >= 8)           score++;
      if (/[A-Z]/.test(val))         score++;
      if (/[0-9]/.test(val))         score++;
      if (/[^A-Za-z0-9]/.test(val))  score++;

      if (score <= 1) {
        bar.classList.add('weak');
        label.textContent = 'Weak password';
        label.style.color = '#ef4444';
      } else if (score <= 3) {
        bar.classList.add('medium');
        label.textContent = 'Medium — add symbols or numbers';
        label.style.color = '#f59e0b';
      } else {
        bar.classList.add('strong');
        label.textContent = 'Strong password';
        label.style.color = '#22c55e';
      }
    }

    function showJsAlert(msg) {
      const el = document.getElementById('js-alert');
      el.style.display = 'flex';
      el.innerHTML = `<i class="fas fa-circle-exclamation" style="margin-right:8px"></i>${msg}`;
    }

    function handleReset() {
      const password = document.getElementById('new-password').value;
      const confirm  = document.getElementById('confirm-password').value;

      if (!password || !confirm) { showJsAlert('Please fill in both fields.'); return; }
      if (password.length < 6)   { showJsAlert('Password must be at least 6 characters.'); return; }
      if (password !== confirm)  { showJsAlert('Passwords do not match.'); return; }

      document.getElementById('reset-form').submit();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleReset();
    });
  </script>

</body>
</html>
